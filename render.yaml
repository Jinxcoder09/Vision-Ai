# Render Blueprint configuration for Eyeva AI
# Native Python deployment: free tier, no credit card required.
services:
  - type: web
    name: eyeva-ai
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --loop asyncio"
    envVars:
      - key: GROQ_API_KEY
        sync: false
        description: "Your Groq API key for Llama 4 Scout VLM, Whisper STT, and Orpheus TTS"

      - key: CORS_ORIGINS
        value: '["*"]'
        description: "Allowed CORS origins"

      - key: VLM_MODEL
        value: "meta-llama/llama-4-scout-17b-16e-instruct"

      - key: WHISPER_MODEL
        value: "whisper-large-v3-turbo"

      - key: KOKORO_VOICE
        value: "af_heart"
